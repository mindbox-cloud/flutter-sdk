name: SDK publish dry run

on:
  workflow_dispatch:
  push:
    branches:
      - 'publish-dry-run/**'
  pull_request:
    branches:
      - master
      - 'support/*'
      - 'mission/*'
  workflow_call:
    inputs:
      branch:
        required: true
        type: string

permissions:
  contents: read

jobs:
  dry-run-publish:
    runs-on: ubuntu-latest
    name: ${{ matrix.package }} dry-run
    strategy:
      matrix:
        package:
          - mindbox_platform_interface
          - mindbox_android
          - mindbox_ios
          - mindbox
      fail-fast: false

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Take the other SDK packages from this checkout within their constraints, since their new versions are not on pub.dev yet
        working-directory: ${{ matrix.package }}
        run: |
          echo 'dependency_overrides:' > pubspec_overrides.yaml
          for sibling in mindbox_platform_interface mindbox_android mindbox_ios mindbox; do
            constraint=$(sed -n "s/^  $sibling: *//p" pubspec.yaml)
            if [ -n "$constraint" ]; then
              printf '  %s:\n    path: ../%s\n    version: %s\n' "$sibling" "$sibling" "$constraint" >> pubspec_overrides.yaml
            fi
          done
          cat pubspec_overrides.yaml

      - name: Dry run publish
        working-directory: ${{ matrix.package }}
        run: flutter pub publish --dry-run
