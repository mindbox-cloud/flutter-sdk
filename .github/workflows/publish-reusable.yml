name: SDK publish

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
    secrets:
      MOBILE_CI_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  analyze_and_test:
    name: Analyze code and run tests before publishing
    uses: ./.github/workflows/analyze_and_test.yml
    with:
      branch: ${{ inputs.branch }}

  publish_dry_run:
    name: Dry run publishing before any tag is created
    uses: ./.github/workflows/publish-dry-run.yml
    with:
      branch: ${{ inputs.branch }}

  set-tags:
    needs: [analyze_and_test, publish_dry_run]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    name: Tag versions that are not on pub.dev yet
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.tags.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
      - name: Create tags
        id: tags
        run: |
          head=$(git rev-parse HEAD)
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          tags_to_create=()
          stale_tags=()
          for package in mindbox_platform_interface mindbox_android mindbox_ios mindbox; do
            version=$(awk '$1 == "version:" { print $2 }' "$package/pubspec.yaml")
            tag="$package-v$version"

            status=$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' \
              "https://pub.dev/api/packages/$package/versions/$version")
            if [ "$status" = 200 ]; then
              echo "$package $version is already on pub.dev, no tag needed"
              continue
            elif [ "$status" != 404 ]; then
              echo "::error::pub.dev answered $status for $package $version"
              exit 1
            fi

            existing=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
            if [ -z "$existing" ]; then
              tags_to_create+=("$tag")
            elif [ "$existing" = "$head" ]; then
              echo "$tag already points to $head"
            else
              echo "::error::$tag points to $existing from an earlier merge, and $package $version is not on pub.dev"
              stale_tags+=("refs/tags/$tag")
            fi
          done

          if [ "${#stale_tags[@]}" -gt 0 ]; then
            echo "Delete the tags of the failed attempt, then re-run this job:"
            echo "  git push origin --delete ${stale_tags[*]}"
            exit 1
          fi

          for tag in "${tags_to_create[@]}"; do
            git push origin "$head:refs/tags/$tag"
          done

  platform_interface_publish:
    needs: [set-tags]
    timeout-minutes: 45
    runs-on: ubuntu-latest
    name: mindbox_platform_interface publishing
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.set-tags.outputs.sha }}
      - uses: ./.github/actions/publish-from-tag
        with:
          package: mindbox_platform_interface

  native_components_publish:
    needs: [set-tags, platform_interface_publish]
    timeout-minutes: 45
    runs-on: ubuntu-latest
    name: ${{ matrix.package }} publishing
    permissions:
      contents: write
      actions: write
    strategy:
      matrix:
        package:
          - 'mindbox_android'
          - 'mindbox_ios'
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.set-tags.outputs.sha }}
      - uses: ./.github/actions/publish-from-tag
        with:
          package: ${{ matrix.package }}

  plugin_publish:
    needs: [set-tags, native_components_publish]
    timeout-minutes: 45
    runs-on: ubuntu-latest
    name: mindbox publishing
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.set-tags.outputs.sha }}
      - uses: ./.github/actions/publish-from-tag
        with:
          package: mindbox

  merge:
    needs: [plugin_publish]
    if: |
      startsWith(github.head_ref, 'release/') &&
      github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MOBILE_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MOBILE_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout develop branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr create --base develop --head master --title "Merge 'master' into 'develop' after release" --body "Automated Pull Request to merge 'master' into 'develop' after release"
      - name: Merge Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr_number=$(gh pr list --base develop --head master --json number --jq '.[0].number')
          gh pr merge "$pr_number" --merge --auto
