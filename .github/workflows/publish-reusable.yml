name: SDK publish

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
    secrets:
      PUB_CREDENTIALS:
        required: true
      PAT_FOR_TRIGGERING_BRANCH_PROTECTION:
        required: true

permissions:
  contents: read

jobs:
  analyze_and_test:
    name: Analyze code and run tests before publishing
    uses: ./.github/workflows/analyze_and_test.yml
    with:
      branch: ${{ inputs.branch }}

  platform_interface_publish:
    needs: [analyze_and_test]
    timeout-minutes: 4
    runs-on: ubuntu-latest
    name: mindbox_platform_interface publishing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          ref: ${{ inputs.branch }}
      - name: Check package Pubspec
        id: pubspec
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set +e
          git diff-tree --no-commit-id --name-only -r HEAD~1 "$HEAD_SHA" | grep 'mindbox_platform_interface/pubspec.yaml'
          rc=$?
          set -e
          echo "changed=$rc" >> "$GITHUB_OUTPUT"
      - name: Extract package version
        if: steps.pubspec.outputs.changed == 0
        run: |
          cd mindbox_platform_interface
          echo "VERSION=$(awk '{if ($1 ~ /^version:/) print $2}' pubspec.yaml)" >> "$GITHUB_ENV"
      - uses: sakebook/actions-flutter-pub-publisher@150ed867828c76c47814ff8bcdfe936273ff7fd1 # v1.21
        if: steps.pubspec.outputs.changed == 0
        with:
          package_directory: mindbox_platform_interface
          credential: ${{ secrets.PUB_CREDENTIALS }}
          flutter_package: true
          skip_test: true
      - name: Create Release
        if: steps.pubspec.outputs.changed == 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.branch }}
        run: ./.github/git-release-ci.sh "mindbox_platform_interface-v$VERSION" "mindbox_platform_interface v$VERSION" "$BRANCH"

  waiting-while-platform-interface-publish:
    needs: [platform_interface_publish]
    runs-on: ubuntu-latest
    steps:
      - name: Delay for 10 minutes
        run: sleep 600

  native_components_publish:
    needs: [analyze_and_test, platform_interface_publish, waiting-while-platform-interface-publish]
    timeout-minutes: 4
    runs-on: ubuntu-latest
    name: ${{ matrix.package }} publishing
    permissions:
      contents: write
    strategy:
      matrix:
        package:
          - 'mindbox_android'
          - 'mindbox_ios'
      fail-fast: false

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          ref: ${{ inputs.branch }}
      - name: Check package Pubspec
        id: pubspec
        env:
          HEAD_SHA: ${{ github.sha }}
          PKG: ${{ matrix.package }}
        run: |
          set +e
          git diff-tree --no-commit-id --name-only -r HEAD~1 "$HEAD_SHA" | grep "$PKG/pubspec.yaml"
          rc=$?
          set -e
          echo "changed=$rc" >> "$GITHUB_OUTPUT"
      - name: Extract package version
        if: steps.pubspec.outputs.changed == 0
        env:
          PKG: ${{ matrix.package }}
        run: |
          cd "$PKG"
          echo "VERSION=$(awk '{if ($1 ~ /^version:/) print $2}' pubspec.yaml)" >> "$GITHUB_ENV"
      - uses: sakebook/actions-flutter-pub-publisher@150ed867828c76c47814ff8bcdfe936273ff7fd1 # v1.21
        if: steps.pubspec.outputs.changed == 0
        with:
          package_directory: ${{ matrix.package }}
          credential: ${{ secrets.PUB_CREDENTIALS }}
          flutter_package: true
          skip_test: true
      - name: Create Release
        if: steps.pubspec.outputs.changed == 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.branch }}
          PKG: ${{ matrix.package }}
        run: ./.github/git-release-ci.sh "$PKG-v$VERSION" "$PKG v$VERSION" "$BRANCH"

  waiting-while-native_components_publish:
    needs: [native_components_publish]
    runs-on: ubuntu-latest
    steps:
      - name: Delay for 10 minutes
        run: sleep 600

  plugin_publish:
    needs: [analyze_and_test, platform_interface_publish, native_components_publish, waiting-while-native_components_publish]
    timeout-minutes: 4
    runs-on: ubuntu-latest
    name: mindbox publishing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          ref: ${{ inputs.branch }}
      - name: Check package Pubspec
        id: pubspec
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set +e
          git diff-tree --no-commit-id --name-only -r HEAD~1 "$HEAD_SHA" | grep 'mindbox/pubspec.yaml'
          rc=$?
          set -e
          echo "changed=$rc" >> "$GITHUB_OUTPUT"
      - name: Extract package version
        if: steps.pubspec.outputs.changed == 0
        run: |
          cd mindbox
          echo "VERSION=$(awk '{if ($1 ~ /^version:/) print $2}' pubspec.yaml)" >> "$GITHUB_ENV"
      - uses: sakebook/actions-flutter-pub-publisher@150ed867828c76c47814ff8bcdfe936273ff7fd1 # v1.21
        if: steps.pubspec.outputs.changed == 0
        with:
          package_directory: mindbox
          credential: ${{ secrets.PUB_CREDENTIALS }}
          flutter_package: true
          skip_test: true
          dry_run: false
      - name: Create Release
        if: steps.pubspec.outputs.changed == 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.branch }}
        run: ./.github/git-release-ci.sh "mindbox-v$VERSION" "mindbox v$VERSION" "$BRANCH"

  merge:
    needs: [plugin_publish]
    if: |
      startsWith(github.head_ref, 'release/') &&
      github.base_ref == 'master'
    runs-on: ubuntu-latest
    env:
      # gh uses this PAT, not the workflow GITHUB_TOKEN — needed so the merge PR
      # re-triggers branch-protection checks. Job-level `permissions:` only scope
      # the workflow token, so they don't apply to these gh calls.
      GITHUB_TOKEN: ${{ secrets.PAT_FOR_TRIGGERING_BRANCH_PROTECTION }}
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: develop
      - name: Create Pull Request
        run: gh pr create --base develop --head master --title "Merge 'master' into 'develop' after release" --body "Automated Pull Request to merge 'master' into 'develop' after release"
      - name: Merge Pull Request
        run: |
          pr_number=$(gh pr list --base develop --head master --json number --jq '.[0].number')
          gh pr merge "$pr_number" --merge --auto
